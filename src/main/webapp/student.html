<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Grades</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header><span id="who"></span> <button id="logout">Log out</button></header>
  <main>
    <section class="stats" id="summary"></section>
    <div class="grid">
      <div class="card"><h2>Average by module</h2><canvas id="moduleChart"></canvas></div>
      <div class="card"><h2>Grade distribution</h2><canvas id="distChart"></canvas></div>
      <div class="card wide"><h2>Trend by semester</h2><canvas id="trendChart"></canvas><p id="prediction"></p></div>
    </div>
    <div class="card"><h2>All results</h2><table id="grades"></table></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
